<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- IC Body Background -->
  <rect x="12" y="12" width="40" height="40" rx="8" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  
  <!-- Silicon Chip Core -->
  <rect x="18" y="18" width="28" height="28" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  
  <!-- Pins Left -->
  <path d="M4 22H12 M4 32H12 M4 42H12" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pins Right -->
  <path d="M52 22H60 M52 32H60 M52 42H60" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pins Top -->
  <path d="M22 4V12 M32 4V12 M42 4V12" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pins Bottom -->
  <path d="M22 52V60 M32 52V60 M42 52V60" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>

  <!-- TS Monogram in Center -->
  <text x="32" y="37" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="900" font-size="16" fill="#1e40af" text-anchor="middle" letter-spacing="-1">TS</text>

  <!-- Corner Notch / Pin 1 indicator -->
  <circle cx="16" cy="16" r="2" fill="#ffffff"/>
</svg>
