<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#070b16"/>
  <defs>
    <pattern id="grid4" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid4)"/>

  <!-- Technical Header -->
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f2fe" letter-spacing="2">[ROBOTICS::AUTONOMOUS_NAVIGATION_CORE]</text>
  <text x="765" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" text-anchor="end">UPSKILL / UNICONVERGE TECH INTERNSHIP</text>

  <!-- Left: Obstacle Avoidance Ultrasonic Radar Sweep -->
  <rect x="40" y="80" width="340" height="320" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="40" y="80" width="340" height="35" rx="8" fill="#131e36"/>
  <text x="55" y="103" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">01. HC-SR04 ULTRASONIC SWEEP RADAR</text>

  <!-- Radar circle -->
  <circle cx="210" cy="220" r="85" fill="#070a13" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="210" cy="220" r="55" fill="none" stroke="#1e293b" stroke-dasharray="2 2"/>
  <circle cx="210" cy="220" r="25" fill="none" stroke="#1e293b"/>
  <!-- Sweep lines -->
  <line x1="210" y1="220" x2="265" y2="155" stroke="#00f2fe" stroke-width="2"/>
  <path d="M 210 220 L 285 185 A 85 85 0 0 0 210 135 Z" fill="#00f2fe" fill-opacity="0.12"/>
  <!-- Target Blip -->
  <circle cx="250" cy="175" r="4" fill="#ef4444"/>
  <text x="260" y="178" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ef4444">18cm OBSTACLE</text>
  <!-- Decision Logic text -->
  <text x="55" y="340" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Scan: Left=42cm | Right=18cm</text>
  <text x="55" y="360" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22c55e" font-weight="bold">Decision: Turn Left Differential</text>
  <text x="55" y="380" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">PWM: MotorA 180 / MotorB 60</text>

  <!-- Right: Line Following Optical Array -->
  <rect x="420" y="80" width="340" height="320" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="420" y="80" width="340" height="35" rx="8" fill="#131e36"/>
  <text x="435" y="103" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c084fc">02. IR REFLECTANCE LINE TRACKING</text>

  <!-- Floor Path & Sensors -->
  <rect x="440" y="130" width="300" height="150" rx="6" fill="#070a13" stroke="#1e293b"/>
  <!-- Black Track Curve -->
  <path d="M 450 250 C 520 250, 530 150, 600 150 C 670 150, 680 230, 730 230" stroke="#334155" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M 450 250 C 520 250, 530 150, 600 150 C 670 150, 680 230, 730 230" stroke="#00f2fe" stroke-width="2" fill="none" stroke-dasharray="4 4"/>

  <!-- Sensor Array Box -->
  <rect x="580" y="135" width="40" height="30" rx="4" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="590" cy="150" r="3" fill="#22c55e"/>
  <circle cx="610" cy="150" r="3" fill="#22c55e"/>
  <text x="600" y="128" font-family="'JetBrains Mono', monospace" font-size="8" fill="#c084fc" text-anchor="middle">IR ARRAY</text>

  <text x="435" y="315" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Differential Correction:</text>
  <text x="435" y="335" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">Sensor[0]: HIGH (Black Line detected)</text>
  <text x="435" y="355" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">Sensor[1]: LOW (Surface detected)</text>
  <text x="435" y="375" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22c55e" font-weight="bold">Output: Correct Heading +12° (Closed-Loop)</text>
</svg>
