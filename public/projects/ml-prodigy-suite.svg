<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#070b16"/>
  <defs>
    <pattern id="grid5" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid5)"/>

  <!-- Technical Header -->
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f2fe" letter-spacing="2">[AI_PIPELINE::PRODIGY_ML_SUITE]</text>
  <text x="765" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b5cf6" text-anchor="end">5 PRACTICAL ML MODULES // SCIKIT-LEARN</text>

  <!-- Card 1: Regression (House Price) -->
  <rect x="40" y="80" width="220" height="150" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="40" y="80" width="220" height="28" rx="6" fill="#131e36"/>
  <text x="50" y="99" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">01. REGRESSION (HOUSE PRICE)</text>
  <!-- Scatter + line -->
  <circle cx="70" cy="180" r="3" fill="#64748b"/>
  <circle cx="90" cy="165" r="3" fill="#64748b"/>
  <circle cx="110" cy="170" r="3" fill="#64748b"/>
  <circle cx="130" cy="150" r="3" fill="#64748b"/>
  <circle cx="160" cy="140" r="3" fill="#64748b"/>
  <circle cx="190" cy="130" r="3" fill="#64748b"/>
  <circle cx="210" cy="120" r="3" fill="#64748b"/>
  <line x1="60" y1="190" x2="230" y2="115" stroke="#00f2fe" stroke-width="2"/>
  <text x="50" y="215" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Minimizing MSE // Feature Normalization</text>

  <!-- Card 2: Clustering (K-Means) -->
  <rect x="290" y="80" width="220" height="150" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="290" y="80" width="220" height="28" rx="6" fill="#131e36"/>
  <text x="300" y="99" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c084fc">02. K-MEANS (SEGMENTATION)</text>
  <!-- Cluster 1 (Cyan) -->
  <circle cx="340" cy="140" r="3.5" fill="#00f2fe"/>
  <circle cx="350" cy="150" r="3.5" fill="#00f2fe"/>
  <circle cx="330" cy="155" r="3.5" fill="#00f2fe"/>
  <rect x="338" y="146" width="6" height="6" fill="#f8fafc"/> <!-- Centroid -->
  <!-- Cluster 2 (Violet) -->
  <circle cx="440" cy="170" r="3.5" fill="#8b5cf6"/>
  <circle cx="455" cy="180" r="3.5" fill="#8b5cf6"/>
  <circle cx="430" cy="185" r="3.5" fill="#8b5cf6"/>
  <rect x="440" y="176" width="6" height="6" fill="#f8fafc"/> <!-- Centroid -->
  <text x="300" y="215" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Elbow Method // Silhouette Metric</text>

  <!-- Card 3: SVM Classification -->
  <rect x="540" y="80" width="220" height="150" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="540" y="80" width="220" height="28" rx="6" fill="#131e36"/>
  <text x="550" y="99" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22c55e">03. SVM CLASSIFIER</text>
  <!-- Decision Boundary -->
  <line x1="560" y1="190" x2="730" y2="130" stroke="#22c55e" stroke-width="2"/>
  <line x1="560" y1="175" x2="730" y2="115" stroke="#22c55e" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="560" y1="205" x2="730" y2="145" stroke="#22c55e" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="550" y="215" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Optimal Hyperplane Margin</text>

  <!-- Card 4 & 5: Vision & Calorie (Bottom) -->
  <rect x="40" y="250" width="345" height="150" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="40" y="250" width="345" height="28" rx="6" fill="#131e36"/>
  <text x="50" y="269" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">04. HAND GESTURE RECOGNITION (OPENCV)</text>
  <!-- Hand Landmark Schematic -->
  <path d="M 120 360 L 120 330 L 105 310 M 120 330 L 115 295 M 120 330 L 130 295 M 120 330 L 140 305 M 120 340 L 150 335" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  <circle cx="105" cy="310" r="3" fill="#c084fc"/>
  <circle cx="115" cy="295" r="3" fill="#c084fc"/>
  <circle cx="130" cy="295" r="3" fill="#c084fc"/>
  <circle cx="140" cy="305" r="3" fill="#c084fc"/>
  <text x="175" y="325" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f8fafc">Landmark Topology</text>
  <text x="175" y="345" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Spatial coordinate vectorization</text>
  <text x="175" y="365" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22c55e">Gesture Class: 'THUMBS_UP' [96%]</text>

  <rect x="415" y="250" width="345" height="150" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="415" y="250" width="345" height="28" rx="6" fill="#131e36"/>
  <text x="425" y="269" font-family="'JetBrains Mono', monospace" font-size="10" fill="#eab308">05. CALORIE ESTIMATION MODEL</text>
  <text x="425" y="310" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Multi-Variable Metabolic Modeling</text>
  <text x="425" y="330" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Inputs: Duration, Heart Rate, Temp, Weight</text>
  <rect x="425" y="345" width="310" height="16" rx="3" fill="#1e293b"/>
  <rect x="425" y="345" width="240" height="16" rx="3" fill="#eab308"/>
  <text x="435" y="357" font-family="'JetBrains Mono', monospace" font-size="8" fill="#070a13" font-weight="bold">Predicted Expenditure: 412 kcal</text>
  <text x="425" y="382" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22c55e">Cross-Validation R² Score Verified</text>
</svg>
