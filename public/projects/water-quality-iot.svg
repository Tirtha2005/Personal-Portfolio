<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#070b16"/>
  
  <defs>
    <pattern id="grid2" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid2)"/>

  <!-- Technical Header -->
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f2fe" letter-spacing="2">[IOT_TELEMETRY::WATER_QUALITY_CORE]</text>
  <text x="765" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b5cf6" text-anchor="end">IEEE ICIET 2026 // PAPER ID: 1062</text>

  <!-- Left: Sensor Probes -->
  <rect x="35" y="75" width="210" height="330" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="35" y="75" width="210" height="32" rx="8" fill="#131e36"/>
  <text x="50" y="95" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">ANALOG PROBES</text>

  <!-- Sensor 1: pH -->
  <rect x="50" y="125" width="180" height="50" rx="6" fill="#080e1c" stroke="#38bdf8" stroke-width="1"/>
  <text x="65" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc" font-weight="bold">pH Sensor V1.1</text>
  <text x="65" y="162" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f2fe">Range: 0-14 pH | Calibrated</text>

  <!-- Sensor 2: Turbidity -->
  <rect x="50" y="185" width="180" height="50" rx="6" fill="#080e1c" stroke="#38bdf8" stroke-width="1"/>
  <text x="65" y="205" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc" font-weight="bold">Turbidity Sensor</text>
  <text x="65" y="222" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f2fe">Optical NTU Transmittance</text>

  <!-- Sensor 3: TDS -->
  <rect x="50" y="245" width="180" height="50" rx="6" fill="#080e1c" stroke="#38bdf8" stroke-width="1"/>
  <text x="65" y="265" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc" font-weight="bold">TDS Sensor</text>
  <text x="65" y="282" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f2fe">Total Dissolved Solids ppm</text>

  <!-- Sensor 4: Temp DS18B20 -->
  <rect x="50" y="305" width="180" height="50" rx="6" fill="#080e1c" stroke="#38bdf8" stroke-width="1"/>
  <text x="65" y="325" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc" font-weight="bold">Temp DS18B20</text>
  <text x="65" y="342" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f2fe">1-Wire Digital Sensor</text>

  <!-- Analog Lines connecting to ADC -->
  <path d="M 230 150 H 280 V 220 H 300" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 230 210 H 300" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 230 270 H 280 V 230 H 300" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Center: ADS1115 & Raspberry Pi -->
  <rect x="300" y="160" width="160" height="150" rx="8" fill="#0f172a" stroke="#00f2fe" stroke-width="2"/>
  <rect x="315" y="175" width="130" height="40" rx="4" fill="#070a13" stroke="#38bdf8"/>
  <text x="380" y="195" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">ADS1115</text>
  <text x="380" y="208" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8" text-anchor="middle">16-Bit I2C ADC</text>

  <text x="380" y="245" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c084fc" text-anchor="middle">SDA / SCL BUS</text>
  <path d="M 380 255 V 275" stroke="#8b5cf6" stroke-width="2"/>

  <rect x="315" y="275" width="130" height="25" rx="4" fill="#070a13" stroke="#8b5cf6"/>
  <text x="380" y="291" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">Raspberry Pi (Edge)</text>

  <!-- Right: MQTT & Grafana Dashboard / ML -->
  <path d="M 460 235 H 510" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 2"/>

  <rect x="510" y="75" width="255" height="330" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="510" y="75" width="255" height="32" rx="8" fill="#131e36"/>
  <text x="525" y="95" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c084fc">MQTT &amp; TELEMETRY</text>

  <!-- Live Graph in Grafana -->
  <rect x="525" y="125" width="225" height="110" rx="6" fill="#070b16" stroke="#1e293b"/>
  <text x="535" y="145" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">REAL-TIME pH &amp; TURBIDITY</text>
  <!-- Chart curves -->
  <path d="M 535 200 Q 565 170, 595 190 T 655 160 T 735 185" stroke="#00f2fe" stroke-width="2" fill="none"/>
  <path d="M 535 215 Q 565 205, 595 210 T 655 195 T 735 200" stroke="#8b5cf6" stroke-width="1.5" fill="none"/>
  <text x="730" y="160" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f2fe" text-anchor="end">pH: 7.2</text>

  <!-- ML Potability Assessment -->
  <rect x="525" y="250" width="225" height="135" rx="6" fill="#070b16" stroke="#1e293b"/>
  <text x="535" y="270" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22c55e" font-weight="bold">AI RISK CLASSIFIER</text>
  <text x="535" y="290" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Model: Multi-Parameter Potability</text>
  
  <rect x="535" y="305" width="205" height="18" rx="3" fill="#1e293b"/>
  <rect x="535" y="305" width="165" height="18" rx="3" fill="#0284c7"/>
  <text x="545" y="318" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f8fafc">Potability Index: SAFE (82%)</text>

  <text x="535" y="345" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">MQTT Broker: Broker / Telemetry Active</text>
  <text x="535" y="365" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">Status: Edge Sensing Loop Running</text>
</svg>
