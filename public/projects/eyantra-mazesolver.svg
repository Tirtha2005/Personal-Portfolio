<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#070b16"/>
  
  <!-- Subtle Grid -->
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Technical Header Overlay -->
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981" letter-spacing="2">[IIT_BOMBAY::E-YANTRA_ROBOTICS_MAZESOLVER]</text>
  <text x="765" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" text-anchor="end">NATIONAL INITIATIVE // ROUND 1 QUALIFIED</text>

  <!-- Left: Pathfinding State Logic & Decision Tree -->
  <rect x="35" y="75" width="310" height="330" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="35" y="75" width="310" height="32" rx="8" fill="#131e36"/>
  <circle cx="55" cy="91" r="4" fill="#ef4444"/>
  <circle cx="69" cy="91" r="4" fill="#eab308"/>
  <circle cx="83" cy="91" r="4" fill="#22c55e"/>
  <text x="105" y="95" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">maze_pathfinding_firmware.cpp</text>

  <!-- Algorithm / Control Flow Snippet -->
  <text x="50" y="130" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">// Sensor Polling &amp; Intersection Logic</text>
  <text x="50" y="150" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c084fc">void <tspan fill="#67e8f9">evaluateNextMove</tspan>() {</text>
  <text x="65" y="170" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">uint8_t walls = readSonarArray();</text>
  <text x="65" y="195" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">if (!(walls &amp; WALL_LEFT)) {</text>
  <text x="80" y="215" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e2e8f0">executeTurn(LEFT_90_DEG);</text>
  <text x="80" y="235" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e2e8f0">driveForwardCell();</text>
  <text x="65" y="255" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">} else if (!(walls &amp; WALL_FRONT)) {</text>
  <text x="80" y="275" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e2e8f0">driveForwardCell();</text>
  <text x="65" y="295" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">} else if (!(walls &amp; WALL_RIGHT)) {</text>
  <text x="80" y="315" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e2e8f0">executeTurn(RIGHT_90_DEG);</text>
  <text x="65" y="335" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f87171">} else { // Dead End Encounter</text>
  <text x="80" y="355" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fb923c">executeTurn(U_TURN_180_DEG);</text>
  <text x="65" y="375" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f87171">}</text>
  <text x="50" y="395" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c084fc">}</text>

  <!-- Right: 2D Maze Simulation & Micromouse Robot Telemetry -->
  <rect x="365" y="75" width="400" height="330" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Maze Grid Box -->
  <g transform="translate(390, 95)">
    <!-- Maze Outer Boundary Walls -->
    <rect x="0" y="0" width="230" height="230" fill="#070a13" stroke="#3b82f6" stroke-width="3"/>
    
    <!-- Internal Maze Walls -->
    <path d="M 0 46 H 138 V 92 H 46" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
    <path d="M 92 0 V 46" stroke="#3b82f6" stroke-width="2.5"/>
    <path d="M 184 46 V 138 H 138" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
    <path d="M 46 138 H 92 V 184 H 46" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
    <path d="M 92 138 V 184" stroke="#3b82f6" stroke-width="2.5"/>
    <path d="M 138 184 H 230" stroke="#3b82f6" stroke-width="2.5"/>
    <path d="M 184 184 V 230" stroke="#3b82f6" stroke-width="2.5"/>
    <path d="M 92 230 V 184" stroke="#3b82f6" stroke-width="2.5"/>

    <!-- Start Node (Green S) -->
    <rect x="6" y="6" width="34" height="34" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="23" y="28" font-family="'JetBrains Mono', monospace" font-size="14" fill="#34d399" font-weight="bold" text-anchor="middle">S</text>

    <!-- Goal Node (Red G) -->
    <rect x="188" y="188" width="36" height="36" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="206" y="211" font-family="'JetBrains Mono', monospace" font-size="14" fill="#f87171" font-weight="bold" text-anchor="middle">G</text>

    <!-- Solved Optimal Trajectory Route -->
    <path d="M 23 23 V 115 H 115 V 69 H 161 V 161 H 115 V 207 H 206" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" fill="none"/>

    <!-- Active Robot Node -->
    <circle cx="161" cy="115" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="161,105 166,118 156,118" fill="#38bdf8"/>
    <!-- Sensor Beams -->
    <line x1="161" y1="105" x2="161" y2="80" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="150" y1="115" x2="125" y2="115" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="172" y1="115" x2="195" y2="115" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(635, 100)">
    <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" font-weight="bold">MAZE METRICS</text>
    
    <rect x="0" y="28" width="115" height="42" rx="4" fill="#070a13" stroke="#1e293b"/>
    <text x="10" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">ALGORITHM</text>
    <text x="10" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981" font-weight="bold">WALL FOLLOW</text>

    <rect x="0" y="78" width="115" height="42" rx="4" fill="#070a13" stroke="#1e293b"/>
    <text x="10" y="94" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">PATH MEMORY</text>
    <text x="10" y="110" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" font-weight="bold">DEAD-END CUT</text>

    <rect x="0" y="128" width="115" height="42" rx="4" fill="#070a13" stroke="#1e293b"/>
    <text x="10" y="144" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">ORGANIZER</text>
    <text x="10" y="160" font-family="'JetBrains Mono', monospace" font-size="10" fill="#facc15" font-weight="bold">IIT BOMBAY</text>

    <rect x="0" y="178" width="115" height="42" rx="4" fill="#070a13" stroke="#1e293b"/>
    <text x="10" y="194" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">STATUS</text>
    <text x="10" y="210" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399" font-weight="bold">R1 QUALIFIED</text>
  </g>

  <!-- Bottom Hardware Specification Strip -->
  <g transform="translate(390, 340)">
    <rect x="0" y="0" width="355" height="50" rx="6" fill="#070a13" stroke="#1e293b"/>
    <text x="15" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">HARDWARE: Microcontroller, Ultrasonic/IR Sonar Array</text>
    <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">ACTUATION: Differential Drive, PWM Speed Control, Turn States</text>
  </g>
</svg>
