  <path d="M 80 310 Q 150 260, 240 220 T 360 210 T 500 170" stroke="#00f2fe" stroke-width="2.5" fill="none"/>
  <!-- Predicted LSTM Extension (dashed) -->
  <path d="M 500 170 Q 580 150, 700 140" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="5 3" fill="none"/>

  <!-- Legend -->
  <rect x="480" y="270" width="230" height="90" rx="4" fill="#070a13" stroke="#1e293b"/>
  <line x1="495" y1="290" x2="525" y2="290" stroke="#00f2fe" stroke-width="2"/>
  <text x="535" y="293" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f8fafc">Ground Truth Series</text>

