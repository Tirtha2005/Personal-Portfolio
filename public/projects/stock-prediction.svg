  <line x1="70" y1="140" x2="70" y2="330" stroke="#334155" stroke-width="1"/>

  <!-- Candlesticks -->
  <line x1="120" y1="260" x2="120" y2="300" stroke="#22c55e" stroke-width="1.5"/>
