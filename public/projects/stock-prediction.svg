  <line x1="160" y1="240" x2="160" y2="280" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="155" y="248" width="10" height="22" fill="#22c55e"/>

  <line x1="200" y1="230" x2="200" y2="275" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="195" y="240" width="10" height="25" fill="#ef4444"/>

