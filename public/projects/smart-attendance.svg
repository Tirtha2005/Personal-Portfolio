  <text x="650" y="199" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22c55e" text-anchor="middle">FACE OK</text>

  <rect x="560" y="270" width="180" height="105" rx="4" fill="#070b16" stroke="#1e293b"/>
  <text x="570" y="290" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">VERIFICATION RECORD:</text>
  <text x="570" y="310" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">ID: #4A7E19 (Verified)</text>
  <text x="570" y="325" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">Count Check: MATCH (1 Person)</text>
  <text x="570" y="340" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22c55e">Anti-Proxy Check: PASSED</text>
  <text x="570" y="358" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Logged @ 09:00:14 AM</text>
