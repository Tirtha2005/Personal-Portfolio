  <circle cx="650" cy="195" r="30" stroke="#00f2fe" stroke-dasharray="4 2" fill="none"/>
  <line x1="650" y1="155" x2="650" y2="175" stroke="#00f2fe" stroke-width="1.5"/>
  <line x1="650" y1="215" x2="650" y2="235" stroke="#00f2fe" stroke-width="1.5"/>
  <line x1="610" y1="195" x2="630" y2="195" stroke="#00f2fe" stroke-width="1.5"/>
