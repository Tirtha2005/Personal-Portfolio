    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid3)"/>

  <!-- Header -->
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f2fe" letter-spacing="2">[EMBEDDED_SYS::SMART_ATTENDANCE_CORE]</text>
