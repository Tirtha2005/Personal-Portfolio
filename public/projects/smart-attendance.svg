  <text x="400" y="222" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">SPI / I2C / UART Bus</text>
  <text x="400" y="236" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22c55e" text-anchor="middle">Wi-Fi Telemetry Sync</text>

  <rect x="310" y="260" width="180" height="70" rx="4" fill="#070a13" stroke="#eab308" stroke-dasharray="3 3"/>
  <text x="400" y="280" font-family="'JetBrains Mono', monospace" font-size="10" fill="#eab308" text-anchor="middle" font-weight="bold">TECHNOVATE 2K25</text>
  <text x="400" y="298" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f8fafc" text-anchor="middle">1st Prize Inter-Collegiate</text>
