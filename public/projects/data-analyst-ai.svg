  <rect x="555" y="130" width="190" height="130" rx="4" fill="#070a13" stroke="#1e293b"/>
  <rect x="575" y="200" width="18" height="50" rx="2" fill="#0284c7"/>
  <rect x="605" y="170" width="18" height="80" rx="2" fill="#00f2fe"/>
  <rect x="635" y="150" width="18" height="100" rx="2" fill="#8b5cf6"/>
  <rect x="665" y="180" width="18" height="70" rx="2" fill="#0284c7"/>
  <rect x="695" y="160" width="18" height="90" rx="2" fill="#38bdf8"/>
  <line x1="565" y1="250" x2="725" y2="250" stroke="#64748b" stroke-width="1"/>

  <text x="555" y="290" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">EXPORT &amp; SUMMARY:</text>
  <text x="555" y="310" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">Interactive SVG / PDF report</text>
  <text x="555" y="330" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">Session History cached locally</text>
  <text x="555" y="360" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22c55e">Prototype UI Functional</text>
