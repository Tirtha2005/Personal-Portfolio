<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#070b16"/>
  <defs>
    <pattern id="grid6" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid6)"/>

  <!-- Technical Header -->
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f2fe" letter-spacing="2">[ANALYTICS::AI_DATA_ANALYST_PIPELINE]</text>
  <text x="765" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#eab308" text-anchor="end">WORK IN PROGRESS // ARCHITECTURAL PROTOTYPE</text>

  <!-- Left: File Ingestion (CSV / XLSX) -->
  <rect x="40" y="80" width="210" height="320" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="40" y="80" width="210" height="35" rx="8" fill="#131e36"/>
  <text x="55" y="103" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">INGESTION ENGINE</text>

