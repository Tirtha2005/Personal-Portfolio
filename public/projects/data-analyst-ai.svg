  <text x="145" y="185" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" text-anchor="middle">12,450 Rows • 14 Features</text>

  <!-- Extracted Schema -->
  <text x="55" y="245" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">SCHEMA PARSER:</text>
  <text x="55" y="270" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">✓ timestamp: datetime64</text>
  <text x="55" y="290" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">✓ sensor_voltage: float32</text>
  <text x="55" y="310" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">✓ error_flags: uint8</text>
  <text x="55" y="340" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22c55e">Data Profiling Complete</text>

  <!-- Arrow -->
  <path d="M 250 240 H 290" stroke="#00f2fe" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Center: Natural Language Query & LLM Processor -->
  <rect x="290" y="80" width="210" height="320" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="290" y="80" width="210" height="35" rx="8" fill="#131e36"/>
  <text x="305" y="103" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c084fc">NATURAL QUERY LLM</text>

  <rect x="305" y="130" width="180" height="60" rx="4" fill="#070a13" stroke="#8b5cf6"/>
  <text x="315" y="152" font-family="'JetBrains Mono', monospace" font-size="8" fill="#c084fc">&gt; "Which variables show peak</text>
  <text x="315" y="167" font-family="'JetBrains Mono', monospace" font-size="8" fill="#c084fc">   variance over time?"</text>

  <rect x="305" y="210" width="180" height="160" rx="4" fill="#070a13" stroke="#1e293b"/>
  <text x="315" y="235" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22c55e">AI INSIGHT GENERATOR</text>
  <text x="315" y="260" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">• Feature 03 variance spike</text>
  <text x="315" y="278" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">  correlates with temp +18%</text>
  <text x="315" y="296" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">• 3 outlier clusters detected</text>
  <text x="315" y="325" font-family="'JetBrains Mono', monospace" font-size="8" fill="#eab308">Generating Visual Plot...</text>

  <!-- Arrow -->
  <path d="M 500 240 H 540" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Right: Dynamic Chart & Visual Explorer -->
  <rect x="540" y="80" width="220" height="320" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="540" y="80" width="220" height="35" rx="8" fill="#131e36"/>
  <text x="555" y="103" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f2fe">DYNAMIC VIZ DASH</text>

