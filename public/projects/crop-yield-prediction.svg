<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#070b16"/>
  <defs>
    <pattern id="gridCrop" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#gridCrop)"/>

  <!-- Technical Header -->
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22c55e" letter-spacing="2">[AGRI_AI::CROP_YIELD_PREDICTION_MODEL]</text>
  <text x="765" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="end">MULTIVARIATE REGRESSION // FEATURE CORRELATION</text>

  <!-- Left: Agricultural Features Input -->
  <rect x="40" y="80" width="220" height="320" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="40" y="80" width="220" height="35" rx="8" fill="#131e36"/>
  <text x="55" y="103" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22c55e">ENVIRONMENTAL FEATURES</text>

  <rect x="55" y="130" width="190" height="48" rx="6" fill="#070a13" stroke="#1e293b"/>
  <text x="65" y="150" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f8fafc">Rainfall &amp; Humidity</text>
  <text x="65" y="167" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">1,120 mm avg // 78% RH</text>

  <rect x="55" y="190" width="190" height="48" rx="6" fill="#070a13" stroke="#1e293b"/>
  <text x="65" y="210" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f8fafc">Soil Chemistry (N-P-K)</text>
  <text x="65" y="227" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22c55e">Nitrogen: 85 // Phosphorus: 42</text>

  <rect x="55" y="250" width="190" height="48" rx="6" fill="#070a13" stroke="#1e293b"/>
  <text x="65" y="270" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f8fafc">Ambient Temperature</text>
  <text x="65" y="287" font-family="'JetBrains Mono', monospace" font-size="8" fill="#eab308">Range: 24°C - 32°C</text>

  <text x="55" y="335" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">StandardScaler Normalization</text>
  <text x="55" y="355" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Outlier Truncation Applied</text>
  <text x="55" y="375" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22c55e">✓ Feature Correlation Matrix OK</text>

  <!-- Flow Arrow -->
  <path d="M 260 240 H 295" stroke="#22c55e" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Center: Predictive Model & Loss Convergence -->
  <rect x="295" y="80" width="220" height="320" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="295" y="80" width="220" height="35" rx="8" fill="#131e36"/>
  <text x="310" y="103" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">REGRESSION PIPELINE</text>

  <rect x="310" y="130" width="190" height="130" rx="6" fill="#070a13" stroke="#1e293b"/>
  <text x="320" y="150" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">LOSS OPTIMIZATION (MSE)</text>
  <!-- Curve -->
  <path d="M 325 170 Q 360 240, 480 245" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M 325 190 Q 370 245, 480 248" stroke="#00f2fe" stroke-width="2" fill="none"/>
  <line x1="325" y1="250" x2="485" y2="250" stroke="#334155" stroke-width="1"/>
  <text x="480" y="235" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00f2fe" text-anchor="end">Min MSE: 0.042</text>

  <rect x="310" y="275" width="190" height="105" rx="6" fill="#070a13" stroke="#1e293b"/>
  <text x="320" y="295" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f8fafc">MODEL PERFORMANCE:</text>
  <text x="320" y="315" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22c55e">R² Score: 0.89 (Test Set)</text>
  <text x="320" y="332" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">MAE: 1.2 tons/hectare</text>
  <text x="320" y="352" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Algorithms: Random Forest / Ridge</text>

  <!-- Flow Arrow -->
  <path d="M 515 240 H 550" stroke="#00f2fe" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Right: Yield Forecast Output -->
  <rect x="550" y="80" width="210" height="320" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="550" y="80" width="210" height="35" rx="8" fill="#131e36"/>
  <text x="565" y="103" font-family="'JetBrains Mono', monospace" font-size="11" fill="#eab308">HARVEST FORECAST</text>

  <rect x="565" y="130" width="180" height="90" rx="6" fill="#070a13" stroke="#22c55e"/>
  <text x="575" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">ESTIMATED HARVEST:</text>
  <text x="575" y="185" font-family="'JetBrains Mono', monospace" font-size="18" fill="#22c55e" font-weight="bold">38.4 Tons</text>
  <text x="575" y="205" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">Confidence Interval: ±4.5%</text>

  <rect x="565" y="235" width="180" height="145" rx="6" fill="#070a13" stroke="#1e293b"/>
  <text x="575" y="260" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f8fafc">OPTIMAL CONDITIONS:</text>
  <text x="575" y="280" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22c55e">✓ Nitrogen Levels Optimal</text>
  <text x="575" y="298" font-family="'JetBrains Mono', monospace" font-size="8" fill="#eab308">⚠ Irrigation Suggestion: +8%</text>
  <text x="575" y="318" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Harvest Window: 18-24 Days</text>
  <text x="575" y="348" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Verified Python Notebook</text>
</svg>
